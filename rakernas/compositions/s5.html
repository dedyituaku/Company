<template>
  <style>
    #root { position: absolute; inset: 0; font-family: "Montserrat", sans-serif; color: #fff; }
    #s5-fg { position: absolute; inset: 0; }
    #s5-head { position: absolute; left: 192px; top: 112px; }
    #s5-head .h1 { margin-top: 10px; }
    #s5-chips { position: absolute; left: 192px; top: 252px; display: grid; grid-template-columns: repeat(2, auto); justify-content: start; gap: 16px; }
    /* satu kartu tunggal: ring KPI manager (data aktual) */
    #s5-card { position: absolute; left: 360px; top: 440px; width: 1200px; height: 500px; padding: 22px 40px; text-align: center; }
    #s5-title { letter-spacing: 0.12em; }
    #s5-sub { margin-top: 8px; font-weight: 700; font-size: 34px; line-height: 44px; color: #fff; }
    #s5-sub b { color: #d4a537; font-weight: 800; }
    #s5-ringw { position: relative; width: 250px; height: 250px; margin: 8px auto 0; }
    #s5-ring { position: absolute; inset: 0; width: 250px; height: 250px; }
    #s5-n { position: absolute; left: 0; right: 0; top: 68px; font-size: 78px; line-height: 110px; text-align: center; }
    #s5-n small { font-size: 42px; color: #d4a537; margin-left: 2px; }
    #s5-rl { margin-top: 8px; font-weight: 700; font-size: 28px; line-height: 34px; color: rgba(255,255,255,0.72); }
    #s5-chipw { margin-top: 10px; }
    #s5-chipw .tag { font-size: 30px; letter-spacing: 0.01em; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080">
    <div id="s5-fg">
      <div id="s5-head"><div class="eyebrow">Key Initiative 3</div><div class="h1">Strengthen Manpower Capability</div></div>
      <div id="s5-chips">
        <div class="chip s5-chip"><span class="ic"><svg><use href="#i-cert"/></svg></span>Managerial Certification</div>
        <div class="chip s5-chip"><span class="ic"><svg><use href="#i-users"/></svg></span>Field Collector Outsourcing</div>
        <div class="chip s5-chip"><span class="ic"><svg><use href="#i-bars"/></svg></span>Centralized Performance Management</div>
      </div>

      <div id="s5-card" class="panel">
        <div class="plabel" id="s5-title"></div>
        <div id="s5-sub"></div>
        <div id="s5-ringw">
          <svg id="s5-ring" viewBox="0 0 270 270">
            <circle cx="135" cy="135" r="112" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="28"/>
            <circle id="s5-arc" cx="135" cy="135" r="112" fill="none" stroke="#d4a537" stroke-width="28" stroke-linecap="round" transform="rotate(-90 135 135)" pathLength="1"/>
          </svg>
          <div id="s5-n" class="bignum"></div>
        </div>
        <div id="s5-rl"></div>
        <div id="s5-chipw"><span class="tag up" id="s5-chip"></span></div>
      </div>
    </div>
  </div>
  <script>
    const D = window.RAKERNAS_DATA, M = D.meta, S = D.scene5;
    const C = D.audio.cues.s5, DUR = D.audio.dur.s5;   // C = detik cue VO di dalam scene (data.json > audio)
    const fmt = (v, d) => v.toFixed(d).replace(".", ",");
    const q = (s) => document.querySelector(s);
    // teks dari data.json > scene5 (template: {t} ambang, {y} tahun pembanding, {ya} tahun 2026*, {n} membaik, {p} persen)
    const pct = Math.round(S.share);
    const fill = (tpl) => tpl.replace("{t}", fmt(S.threshold, 2)).replace("{y}", M.yearBefore).replace("{ya}", M.yearAfter).replace("{n}", S.improved).replace("{p}", pct).replace("{r}", S.recorded).replace("{m}", S.missing);
    q("#s5-title").textContent = fill(S.title);
    q("#s5-sub").textContent = fill(S.subtitle);
    q("#s5-rl").textContent = fill(S.ringLabel);
    q("#s5-chip").textContent = fill(S.chip);
    q("#s5-n").innerHTML = "0<small>%</small>";

    const tl = gsap.timeline({ paused: true });
    const K = C.k, MM = Math.max(C.m, K + 1.6), CC = Math.max(C.c, MM + 1.2);   // kartu saat "Dari manager...", ring terisi saat angka disebut, chip saat "kini membaik"
    tl.fromTo("#s5-head", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.3);
    document.querySelectorAll(".s5-chip").forEach((el, i) =>
      tl.fromTo(el, { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 1.4 + i * 0.6));
    tl.fromTo("#s5-fg", { x: 14 }, { x: -14, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#s5-card", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, K);
    const cnt = { v: 0 };
    tl.fromTo("#s5-arc", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 1 - S.share / 100, duration: 2.2, ease: "power2.inOut" }, MM);
    tl.to(cnt, { v: S.share, duration: 2.2, ease: "power2.inOut", onUpdate() { q("#s5-n").innerHTML = Math.round(cnt.v) + "<small>%</small>"; } }, MM);
    tl.fromTo("#s5-chip", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, CC);
    window.__timelines["s5"] = tl;
  </script>
</template>
