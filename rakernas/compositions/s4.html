    q("#s4-d2").textContent = (p.after < p.before ? "▼ " : "▲ ") + fmt(Math.abs(((p.after - p.before) / p.before) * 100), 0) + "%";

    const w2 = [(p.before / Math.max(p.before, p.after)) * 100, (p.after / Math.max(p.before, p.after)) * 100];

    tl.fromTo("#s4-p2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 4.5);
    tl.fromTo("#s4-fg", { x: 14 }, { x: -14, duration: 18, ease: "none" }, 0);
