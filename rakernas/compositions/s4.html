    const goodCls = (e) => ((e.better === "down") === (e.after < e.before) ? "up" : "bad");

    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#s4-msg", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.2);
    qa(".s4-chip").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.2 + i * 0.4));

    tl.fromTo("#s4-f1a", { width: "0%" }, { width: w1a + "%", duration: 1.0, ease: "power3.out" }, 5.2);
    tl.fromTo("#s4-target", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.6);
    tl.fromTo("#s4-tlab", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.6);
