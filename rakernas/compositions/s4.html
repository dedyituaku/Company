<template>
  <style>

    #s4-fg { position: absolute; inset: 0; }
    #s4-head { position: absolute; left: 192px; top: 108px; }

    .s4-yr { font-weight: 700; font-size: 32px; line-height: 38px; color: var(--mute); } .s4-yr.a { color: var(--gold); }
    .s4-prev { font-weight: 700; font-size: 64px; line-height: 150px; color: var(--mute); font-variant-numeric: tabular-nums; }
    .s4-arrow { font-size: 64px; line-height: 150px; color: var(--gold); font-weight: 800; }
    .s4-nw { display: flex; align-items: baseline; height: 150px; white-space: nowrap; }

    .s4-p .unit { font-size: 64px; }
    .s4-tagw { margin-left: auto; align-self: center; }
    .s4-meter { position: absolute; left: 40px; right: 40px; top: 292px; }
    #s4-coc { position: absolute; left: 40px; top: 452px; }
    #s4-coc .tag { font-size: 32px; letter-spacing: 0.02em; white-space: nowrap; }
    .s4-p .plabel { letter-spacing: 0.08em; }
    .s4-mrow { margin-bottom: 14px; }
    .s4-mlab { font-weight: 700; font-size: 32px; line-height: 38px; color: var(--mute); } .s4-mlab.a { color: var(--gold); }
    .s4-track { height: 52px; border-radius: 26px; background: rgba(255,255,255,0.08); position: relative; }
    .s4-fill { height: 100%; border-radius: 26px; }

    #s4-tlab { position: absolute; top: -44px; transform: translateX(-50%); font-weight: 800; font-size: 34px; color: #fff; white-space: nowrap; }
    #s4-mt { position: relative; height: 48px; }
      </style>
  <div id="root" data-composition-id="s4" data-width="1920" data-height="1080">
    <div id="s4-fg">
      <div id="s4-head"><div class="eyebrow">Key Initiative 2</div><div class="h1">Collection Cost Optimization</div></div>
      <div id="s4-msg">Realisasi cost sesuai plan, <b>efektif dan efisien</b></div>
      <div id="s4-chips">
        <div class="chip s4-chip"><span class="ic"><svg><use href="#i-coll"/></svg></span>Field Collector Capacity</div>
        <div class="chip s4-chip"><span class="ic"><svg><use href="#i-split"/></svg></span>NPL-WO Segmentation</div>
        <div class="chip s4-chip"><span class="ic"><svg><use href="#i-box"/></svg></span>Inventory Selling Channel</div>
        <div class="chip s4-chip"><span class="ic"><svg><use href="#i-debt"/></svg></span>Debt Sale WO</div>
      </div>

      <div id="s4-p1" class="panel s4-p">
        <div class="plabel" id="s4-l1"></div>
        <div class="s4-row">
          <div><div class="s4-yr a s4-ya"></div><div class="s4-nw"><span class="bignum" id="s4-n1"></span><span class="unit" id="s4-u1"></span></div></div>
        </div>
        <div class="s4-meter">
          <div id="s4-mt"><div id="s4-tlab"></div></div>
          <div class="s4-mrow"><div class="s4-track"><div class="s4-fill" id="s4-f1b" style="background:linear-gradient(90deg,#2f80ed,#7db4ff)"></div></div></div>
          <div id="s4-target"></div>
        </div>
        <div id="s4-coc"><span class="tag" id="s4-cocchip"></span></div>
      </div>

      <div id="s4-dummy" class="dummy" style="display:none"></div>
    </div>
  </div>
  <script>
    const D = window.RAKERNAS_DATA, M = D.meta;
    const C = D.audio.cues.s4, DUR = D.audio.dur.s4;   // C = detik cue VO di dalam scene (data.json > audio)
    const dec = (...v) => Math.max(...v.map((x) => (String(x).split(".")[1] || "").length));
    const fmt = (v, d) => v.toFixed(d).replace(".", ",");
    const q = (s) => document.querySelector(s), qa = (s) => document.querySelectorAll(s);
    qa(".s4-ya").forEach((e) => (e.textContent = M.yearAfter));
    if (M.showDummyMarkers && (M.dummyScenes || []).includes("s4")) { const d = q("#s4-dummy"); d.style.display = "block"; d.textContent = M.dummyBadgeText; }

    // Satu kartu besar: realisasi cost vs plan (2026* saja; tidak ada pembanding 2025) + chip COC YTD
    const c = D.costVsPlan, coc = D.cocYtd, dc = dec(c.after), dcoc = dec(coc.before, coc.after);
    q("#s4-l1").textContent = c.label;
    q("#s4-n1").textContent = fmt(0, dc); q("#s4-u1").textContent = c.unit;
    q("#s4-tlab").textContent = "Target " + fmt(c.target, 0) + c.unit;
    const chip = q("#s4-cocchip");
    chip.textContent = coc.label + " " + fmt(coc.before, dcoc) + coc.unit + " → " + fmt(coc.after, dcoc) + coc.unit;
    chip.classList.add((coc.better === "down") === (coc.after < coc.before) ? "up" : "bad");   // hijau hanya bila membaik

    // skala bar: 0..130%
    const SC = 130, trackW = 1320, w1b = (c.after / SC) * 100, tx = (c.target / SC) * trackW;
    q("#s4-tlab").style.left = tx + "px"; q("#s4-target").style.left = tx + "px";

    const tl = gsap.timeline({ paused: true });
    const P = C.p, MM = Math.max(C.m, P + 2.0), B = Math.max(C.b, MM + 1.0);   // panel saat "Realisasi cost", angka saat "...persen dari plan", chip COC saat "cost of credit"
    tl.fromTo("#s4-head", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.3);
    tl.fromTo("#s4-msg", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.2);
    qa(".s4-chip").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.2 + i * 0.4));
    tl.fromTo("#s4-fg", { x: 12 }, { x: -12, duration: DUR, ease: "none" }, 0);

    tl.fromTo("#s4-p1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, P);
    tl.fromTo("#s4-target", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P + 1.0);
    tl.fromTo("#s4-tlab", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P + 1.0);
    const c1 = { v: 0 };
    tl.to(c1, { v: c.after, duration: 1.8, ease: "power2.inOut", onUpdate() { q("#s4-n1").textContent = fmt(c1.v, dc); } }, MM);
    tl.fromTo("#s4-f1b", { width: "0%" }, { width: w1b + "%", duration: 1.8, ease: "power2.inOut" }, MM);
    tl.fromTo("#s4-cocchip", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, B);

    window.__timelines["s4"] = tl;
  </script>
</template>
