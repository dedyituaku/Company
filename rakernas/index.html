    <style>
      :root {
        --navy: #0a1628;
        --navy2: #10213d;
        --gold: #d4a537;
        --blue: #2f80ed;
        --ink: #ffffff;
        --mute: rgba(255, 255, 255, 0.62);
        --font: "Montserrat", "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
      #root { position: relative; width: 1920px; height: 1080px; font-family: var(--font); color: var(--ink); }
      #bg { position: absolute; inset: 0; z-index: 0;
        background: radial-gradient(ellipse 80% 70% at 50% 40%, #12274a 0%, var(--navy) 62%, #060e1b 100%); }
      #rig { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 1; }
      #particles { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
      #particles i { position: absolute; border-radius: 50%; display: block; }
      #flash { position: absolute; inset: 0; z-index: 50; background: #fff; opacity: 0; pointer-events: none; }
      .scene-host { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 10; }

      /* ---------- gaya bersama (dipakai semua scene) ---------- */
      .eyebrow { font-weight: 700; font-size: 28px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); }
      .h1 { font-weight: 800; font-size: 68px; line-height: 1.05; letter-spacing: -0.02em; }
      .chip { display: flex; align-items: center; gap: 16px; height: 84px; padding: 0 28px 0 18px; border-radius: 42px;
        background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.16); font-weight: 600; font-size: 28px; white-space: nowrap; }
      .chip .ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(47,128,237,0.22); color: #7db4ff; }
      .chip .ic svg { width: 32px; height: 32px; }
      .panel { position: absolute; border-radius: 28px; padding: 36px 40px; background: linear-gradient(160deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025)), rgba(5,12,28,0.5);
        border: 1.5px solid rgba(255,255,255,0.14); }
      .plabel { font-weight: 700; font-size: 28px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); }
      .bignum { font-weight: 900; font-size: 148px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      .unit { font-weight: 700; font-size: 56px; color: var(--gold); margin-left: 8px; }
      .tag { display: inline-block; font-weight: 700; font-size: 28px; letter-spacing: 0.1em; padding: 8px 18px; border-radius: 999px; }
      .tag.good { background: rgba(212,165,55,0.18); color: var(--gold); border: 1.5px solid rgba(212,165,55,0.6); }
      .tag.up { background: rgba(61,220,132,0.16); color: #3ddc84; border: 1.5px solid rgba(61,220,132,0.6); }
      .tag.bad { background: rgba(255,99,99,0.16); color: #ff7b7b; border: 1.5px solid rgba(255,99,99,0.6); }
      #footnote { position: absolute; left: 96px; bottom: 54px; z-index: 20; font-weight: 600; font-size: 28px; line-height: 36px; color: rgba(255,255,255,0.6); opacity: 0; }
      .dummy { position: absolute; right: 100px; top: 56px; font-weight: 800; font-size: 28px; letter-spacing: 0.1em; color: #ffd36b;
        border: 2px dashed #ffd36b; border-radius: 10px; padding: 10px 18px; background: rgba(10,22,40,0.7); z-index: 30; }
    </style>

    <script>
      const D = window.RAKERNAS_DATA;
      RIG.init(document.getElementById("rig"));
      const tl = gsap.timeline({ paused: true });
      const TOTAL = D.timing.total;
      document.getElementById("footnote").textContent = D.meta.footnote;
      tl.fromTo("#footnote", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, D.timing.scenes[2].start + 0.5);
      tl.to("#footnote", { opacity: 0, duration: 0.4 }, D.timing.scenes[4].end - 0.6);

      // flash putih di setiap batas scene
      tl.set("#flash", { opacity: 0 }, 0);
      D.timing.flashAt.forEach((t) => {
        tl.to("#flash", { opacity: 1, duration: 0.32, ease: "power2.in" }, t - 0.32);
        tl.to("#flash", { opacity: 0, duration: 0.55, ease: "power2.out" }, t + 0.02);
      });

      // partikel cahaya halus (seeded)
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(2026);
      const host = document.getElementById("particles");
      for (let i = 0; i < 46; i++) {
        const el = document.createElement("i");
        const size = 3 + rnd() * 7;
        const gold = rnd() < 0.55;
        el.style.cssText = `left:${(rnd() * 1920).toFixed(0)}px;top:${(rnd() * 1080).toFixed(0)}px;width:${size}px;height:${size}px;` +
          `background:${gold ? "#d4a537" : "#6fa8ff"};box-shadow:0 0 ${size * 3}px ${gold ? "rgba(212,165,55,.8)" : "rgba(47,128,237,.8)"};opacity:0;`;
        host.appendChild(el);
        const rise = 120 + rnd() * 260, drift = (rnd() - 0.5) * 120;
        tl.fromTo(el, { y: 0, x: 0 }, { y: -rise, x: drift, duration: TOTAL, ease: "none" }, 0);
        const cycle = 3 + rnd() * 4, peak = 0.25 + rnd() * 0.5, off = rnd() * cycle;
        tl.fromTo(el, { opacity: 0 }, { opacity: peak, duration: cycle, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((TOTAL - off) / cycle) - 1) }, off);
      }
      window.__timelines["main"] = tl;
    </script>
