   bagian <script> paling bawah file ini. Struktur (grup, sub-
   segmen) diatur lewat DATA.groups — menambah/menghapus segmen
   baru tidak perlu mengubah kode, cukup edit objek DATA.
   ============================================================ */
:root{
  --navy-900:#0e2233; --navy-800:#16324a; --navy-600:#2c5a7a; --navy-100:#eef3f7;
  --slate-900:#1b2430; --slate-700:#42505f; --slate-500:#6b7889; --slate-300:#c3ccd6; --slate-100:#f4f6f8; --slate-50:#fafbfc;
  --teal-700:#0d6b57; --teal-600:#12886e; --teal-100:#e2f3ee;
  --coral-700:#a13a1f; --coral-600:#c14b2a; --coral-100:#fbe9e3;
  --amber-700:#8a5a08; --amber-600:#b07811; --amber-100:#fbf1de;
  --border:#e2e6ea;
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--slate-50); color:var(--slate-900); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:28px 24px 64px;}

/* header */
.masthead{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:24px; padding-bottom:20px; border-bottom:2px solid var(--navy-900);}
.masthead h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em; color:var(--navy-900);}
.masthead p{margin:0; font-size:13px; color:var(--slate-500);}
.period-badge{font-family:var(--font-mono); font-size:12px; background:var(--navy-900); color:#fff; padding:6px 12px; border-radius:4px; letter-spacing:0.02em;}

/* section labels */
.section-label{font-size:13px; font-weight:600; color:var(--navy-800); margin:0 0 12px; text-transform:uppercase; letter-spacing:0.03em;}
.section{margin-bottom:36px;}
.big-divider{border:none; border-top:2px solid var(--navy-900); margin:40px 0 28px;}
.eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--slate-500); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 6px;}

/* kpi cards */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px;}
.kpi-card{background:#fff; border:1px solid var(--border); border-left:4px solid var(--navy-600); border-radius:6px; padding:16px 18px;}
.kpi-card .label{font-size:12px; color:var(--slate-500); font-weight:600; margin:0 0 6px;}
.kpi-card .value{font-size:26px; font-weight:700; color:var(--navy-900); margin:0; font-family:var(--font-mono); letter-spacing:-0.01em;}
.kpi-card .delta{font-size:12px; font-weight:600; margin:6px 0 0; display:flex; align-items:center; gap:4px;}
.delta.good{color:var(--teal-700);} .delta.bad{color:var(--coral-700);} .delta.neutral{color:var(--slate-500);}

/* chart cards */
.chart-card{background:#fff; border:1px solid var(--border); border-radius:8px; padding:18px 20px 8px;}
.chart-card .chart-title{font-size:13px; font-weight:600; color:var(--navy-800); margin:0 0 2px;}
.chart-card .chart-sub{font-size:11.5px; color:var(--slate-500); margin:0 0 12px;}
.chart-canvas-wrap{position:relative; width:100%;}

.grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
.grid-3-small{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px;}
.grid-auto-small{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px;}
.legend-row{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--slate-500); margin-top:6px;}
.legend-row .dot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px;}

/* comparison table */
table.summary{width:100%; border-collapse:collapse; font-size:13px;}
table.summary th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-500);
  font-weight:600; padding:8px 10px; border-bottom:2px solid var(--navy-900);
}
table.summary td{padding:9px 10px; border-bottom:1px solid var(--border); color:var(--slate-900);}
table.summary tr:hover td{background:var(--slate-100);}
table.summary td.num{font-family:var(--font-mono); text-align:right;}
table.summary td.group-row{background:var(--navy-100); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--navy-800);}
.tag{display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px;}
.tag.good{background:var(--teal-100); color:var(--teal-700);}
.tag.bad{background:var(--coral-100); color:var(--coral-700);}
.tag.watch{background:var(--amber-100); color:var(--amber-700);}
.tag.na{background:var(--slate-100); color:var(--slate-500);}

/* concern list */
.concern-item{
  display:flex; align-items:flex-start; gap:10px; padding:10px 4px;
  border-bottom:1px solid var(--border); font-size:13px; line-height:1.5;
}
.concern-item:last-child{border-bottom:none;}
.concern-item .tag{flex-shrink:0; margin-top:1px;}
.concern-empty{font-size:13px; color:var(--slate-500); padding:8px 4px;}

/* tab navigation (product group) */
.tab-nav{display:flex; gap:6px; border-bottom:2px solid var(--navy-900); margin-bottom:20px; flex-wrap:wrap;}
.tab-btn{
  font-family:var(--font-ui); font-size:13.5px; font-weight:600; color:var(--slate-500);
  background:transparent; border:none; padding:10px 18px; cursor:pointer; border-radius:6px 6px 0 0;
  position:relative; top:2px;
}
.tab-btn:hover{color:var(--navy-800); background:var(--slate-100);}
.tab-btn.active{color:#fff; background:var(--navy-900);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* segment pills within a tab */
.segment-pills{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
.segment-pill{
  font-family:var(--font-ui); font-size:12.5px; font-weight:600; color:var(--navy-800);
  background:#fff; border:1.5px solid var(--slate-300); padding:7px 14px; border-radius:20px; cursor:pointer;
}
.segment-pill:hover{border-color:var(--navy-600);}
.segment-pill.active{background:var(--navy-800); border-color:var(--navy-800); color:#fff;}
.segment-pill .pill-note{opacity:0.7; font-weight:500;}

.group-agg-strip{
  display:flex; gap:20px; flex-wrap:wrap; align-items:baseline; background:var(--navy-900); color:#fff;
  border-radius:8px; padding:16px 20px; margin-bottom:20px;
}
.group-agg-strip .agg-item{display:flex; flex-direction:column; gap:2px;}
.group-agg-strip .agg-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; opacity:0.65;}
.group-agg-strip .agg-value{font-family:var(--font-mono); font-size:19px; font-weight:700;}
.group-agg-strip .agg-value.good{color:#7fd9c0;}
.group-agg-strip .agg-value.bad{color:#f0a68c;}

.no-portfolio{
  background:var(--slate-100); border:1px dashed var(--slate-300); border-radius:8px;
  padding:24px; text-align:center; color:var(--slate-500); font-size:13px; margin-bottom:20px;
}

/* gate / bumper page */
#gateOverlay{
  position:fixed; inset:0; background:var(--navy-900); display:flex; align-items:center; justify-content:center;
  z-index:999; padding:20px;
}
.gate-card{
  background:#fff; border-radius:12px; padding:36px 32px; width:100%; max-width:360px; text-align:center;
  box-shadow:0 0 0 1px rgba(255,255,255,0.06);
}
.gate-card .gate-icon{
  width:44px; height:44px; border-radius:50%; background:var(--navy-100); color:var(--navy-800);
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:20px;
}
.gate-card h2{font-size:17px; font-weight:600; color:var(--navy-900); margin:0 0 4px;}
.gate-card p{font-size:13px; color:var(--slate-500); margin:0 0 20px;}
#gateInput{
  width:100%; font-family:var(--font-mono); font-size:22px; letter-spacing:10px; text-align:center;
  padding:12px 8px 12px 18px; border:1.5px solid var(--slate-300); border-radius:8px; color:var(--navy-900);
  margin-bottom:14px;
}
#gateInput:focus{outline:none; border-color:var(--navy-600);}
#gateInput.shake{animation:gateShake 0.35s;}
@keyframes gateShake{
  0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);} 80%{transform:translateX(6px);}
}
#gateBtn{
  width:100%; background:var(--navy-900); color:#fff; border:none; border-radius:8px; padding:11px;
  font-family:var(--font-ui); font-size:14px; font-weight:600; cursor:pointer;
}
#gateBtn:hover{background:var(--navy-800);}
#gateError{font-size:12.5px; color:var(--coral-700); margin:12px 0 0; min-height:16px;}
.hidden-app{display:none;}

@media (max-width:800px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .grid-3-small{grid-template-columns:1fr;}
  .group-agg-strip{gap:14px;}
}
</style>
</head>

   Ganti angka di bawah ini untuk mengubah kode akses dashboard.
   Ini proteksi ringan sisi client saja — bukan pengganti keamanan
   sesungguhnya (kode tetap terlihat lewat "view page source").
   ============================================================ */
const ACCESS_CODE = "000999";

(function setupGate(){
  const overlay = document.getElementById("gateOverlay");
  const app = document.getElementById("mainApp");
  const input = document.getElementById("gateInput");
  const btn = document.getElementById("gateBtn");
  const err = document.getElementById("gateError");

  function unlock(){
    overlay.style.display = "none";
    app.classList.remove("hidden-app");
    try{ sessionStorage.setItem("bfiDashUnlocked", "1"); }catch(e){}
  }
  function tryUnlock(){
    if(input.value === ACCESS_CODE){ unlock(); }
    else {
      err.textContent = "Kode salah, coba lagi.";
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      input.value = ""; input.focus();
    }
  }
  try{ if(sessionStorage.getItem("bfiDashUnlocked") === "1"){ unlock(); } }catch(e){}
  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", e=>{ if(e.key === "Enter") tryUnlock(); });
  input.addEventListener("input", ()=>{ input.value = input.value.replace(/[^0-9]/g,"").slice(0,6); });
  if(overlay.style.display !== "none") setTimeout(()=>input.focus(), 50);
})();

  if(budget===null || budget===undefined) return '<span class="tag na">no budget</span>';
  const d = actual - budget;
  const relDiff = budget !== 0 ? Math.abs(d / budget) : Math.abs(d);
  const good = lowerIsBetter ? d<=0 : d>=0;
  const watch = !good && relDiff<=0.05;
  if(good) return '<span class="tag good">on track</span>';
  if(watch) return '<span class="tag watch">watch</span>';
  return lowerIsBetter ? '<span class="tag bad">over budget</span>' : '<span class="tag bad">not achieve budget</span>';
}
function yoyTag(actual, ly, lowerIsBetter=true){
  if(actual===null || actual===undefined || ly===null || ly===undefined) return '<span class="tag na">YoY n/a</span>';
  const d = actual - ly;
  const better = lowerIsBetter ? d<=0 : d>=0;
  return better ? '<span class="tag good">better than YoY</span>' : '<span class="tag bad">worse than YoY</span>';
}

/* ---------- flatten helper: iterate leaf sub-segments ---------- */
// opts.groupFilter: only this group (for per-tab concern lists)
// opts.excludeOutOfScope: skip segments marked out-of-scope for that group (used for consolidated Summary calcs)
function forEachLeafSegment(cb, opts={}){
  const groups = opts.groupFilter ? [opts.groupFilter] : DATA.groupOrder;
  groups.forEach(gName=>{
    const g = DATA.groups[gName];
    const oos = g.outOfScope || [];
    g.segmentOrder.forEach(sName=>{
      if(opts.excludeOutOfScope && oos.includes(sName)) return;
      cb(gName, sName, g.segments[sName]);
    });
  });
}

/* ---------- generic concern computation for a set of leaf segments ---------- */
function computeConcerns(opts={}){
  const concerns = [];
  let leafCount = 0, onTrackCount = 0, budgetedCount = 0;
  const showGroupLabel = !opts.groupFilter;

  forEachLeafSegment((gName, sName, p)=>{
    if(!hasData(p)) return;
    leafCount++;
    const last = LAST, prev = LAST-1;
    const cocN = p.cocYTD[last];
    const cocB = p.budget ? p.budget.cocYTD : null;
    const cocLYv = p.lastYear ? p.lastYear.cocYTD : null;
    const overPP = (cocB!==null && cocB!==undefined && cocN!==null) ? cocN-cocB : null;
    const yoyPP = (cocLYv!==null && cocLYv!==undefined && cocN!==null) ? cocN-cocLYv : null;
    const nplN = p.npl90[last], nplP = p.npl90[prev];
    const nplDelta = (nplN!==null && nplN!==undefined && nplP!==null && nplP!==undefined) ? nplN-nplP : null;
    const llpN = p.llpInvYTD[last], llpP = p.llpInvYTD[prev];
    const llpDelta = (llpN!==null && llpN!==undefined && llpP!==null && llpP!==undefined) ? llpN-llpP : null;
    const torN = p.tor[last];
    const torGap = (torN!==null && torN!==undefined) ? torN-100 : null;

    if(cocB!==null && cocB!==undefined){
      budgetedCount++;
      if(cocN!==null && cocN<=cocB) onTrackCount++;
    }

    const tagLabel = showGroupLabel
      ? `<b>${sName}</b> <span style="color:var(--slate-500); font-weight:500;">(${gName})</span>`
      : `<b>${sName}</b>`;

    if(overPP!==null && overPP>0.3){
      concerns.push({ tag:"bad", severity:overPP*10, text:`${tagLabel} — COC YTD% ${fmtPct(cocN)}, ${overPP.toFixed(2)}pp di atas budget (${fmtPct(cocB)})` });
    }
    if(yoyPP!==null && yoyPP>0.3){
      concerns.push({ tag:"bad", severity:yoyPP*8, text:`${tagLabel} — COC YTD% memburuk ${yoyPP.toFixed(2)}pp vs ${DATA.months[LAST]} tahun lalu (${fmtPct(cocLYv)})` });
    }
    if(llpDelta!==null && llpDelta>5000){
      concerns.push({ tag:"bad", severity:llpDelta/500, text:`${tagLabel} — Δ LLP inventori naik Rp${fmtNum(llpDelta)} juta dalam sebulan (${DATA.months[prev]} → ${DATA.months[last]})` });
    }
    if(nplDelta!==null && nplDelta>0.1){
      concerns.push({ tag:"watch", severity:nplDelta*15, text:`${tagLabel} — NPL 90+ naik ${nplDelta.toFixed(2)}pp MoM, kini ${fmtPct(nplN)}` });
    }
    if(torGap!==null && torGap<-20){
      concerns.push({ tag:"watch", severity:-torGap*0.5, text:`${tagLabel} — TOR ${torN}% (target 100%), disposal aset melambat` });
    }
  }, opts);

  concerns.sort((a,b)=>b.severity-a.severity);
  return { concerns, leafCount, onTrackCount, budgetedCount };
}

function renderConcernList(listElId, concerns, maxItems=6){
  const top = concerns.slice(0, maxItems);
  const list = document.getElementById(listElId);
  if(top.length===0){
    list.innerHTML = '<li class="concern-empty">Tidak ada concern signifikan terdeteksi dari data periode ini.</li>';
  } else {
    list.innerHTML = top.map(c=>`<li class="concern-item"><span class="tag ${c.tag}">${c.tag==="bad"?"perhatian":"watch"}</span><span>${c.text}</span></li>`).join("");
  }
  return top;
}

            <th style="text-align:right;">TOR</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="chart-sub" style="margin-top:10px;">Segmen bertanda <i>*di luar cakupan BFI Without FIT</i> tidak ikut dihitung dalam KPI Summary konsolidasi.</p>
    </div>
  `;
  return panel;
}

/* ---------- product group tabs ---------- */
let activeGroup = null;
let activeSegment = {}; // per group: "__agg__" or a segment name

function groupAggStrip(gName){
  const g = DATA.groups[gName];
  const agg = g.aggregate;
  const dBudget = deltaTag(agg.cocYTD[LAST], agg.budget?agg.budget.cocYTD:null, true);
  const dLY = deltaTag(agg.cocYTD[LAST], agg.lastYear?agg.lastYear.cocYTD:null, true);
  return `
    <div class="group-agg-strip">
      <div class="agg-item"><span class="agg-label">ENR ${gName}</span><span class="agg-value">${fmtNum(agg.enr[LAST])} jt</span></div>
      <div class="agg-item"><span class="agg-label">COC YTD%</span><span class="agg-value">${fmtPct(agg.cocYTD[LAST])}</span></div>
      <div class="agg-item"><span class="agg-label">vs Budget</span><span class="agg-value ${dBudget.cls==='good'?'good':dBudget.cls==='bad'?'bad':''}">${dBudget.d!==undefined?(dBudget.d>=0?"+":"")+dBudget.d.toFixed(2)+"pp":"n/a"}</span></div>
      <div class="agg-item"><span class="agg-label">vs YoY</span><span class="agg-value ${dLY.cls==='good'?'good':dLY.cls==='bad'?'bad':''}">${dLY.d!==undefined?(dLY.d>=0?"+":"")+dLY.d.toFixed(2)+"pp":"n/a"}</span></div>
      <div class="agg-item"><span class="agg-label">NPL 90+%</span><span class="agg-value">${fmtPct(agg.npl90[LAST])}</span></div>
      <div class="agg-item"><span class="agg-label">TOR</span><span class="agg-value">${agg.tor[LAST]!==null&&agg.tor[LAST]!==undefined?agg.tor[LAST]+"%":"n/a"}</span></div>
    </div>
  `;
}

function buildTabPanel(gName){
  const g = DATA.groups[gName];
  const panel = document.createElement("div");
  panel.className = "tab-panel";
  panel.id = `tabpanel-${gName}`;

  let pillsHTML = `<button class="segment-pill" data-group="${gName}" data-segment="__agg__">Semua ${gName} <span class="pill-note">(agregat)</span></button>`;
  g.segmentOrder.forEach(sName=>{
    const oosMark = (g.outOfScope||[]).includes(sName) ? ' <span class="pill-note">*</span>' : '';
    pillsHTML += `<button class="segment-pill" data-group="${gName}" data-segment="${sName}">${sName}${oosMark}</button>`;
  });

  const scopeFootnote = (g.outOfScope && g.outOfScope.length)
    ? `<p class="chart-sub" style="margin:-8px 0 16px;">*${g.outOfScope.join(", ")} berada di luar cakupan BFI Without FIT, sehingga tidak masuk hitungan KPI tab Summary — tetap dipantau di sini karena relevan secara bisnis.</p>`
    : '';

  const aggNote = g.aggNote ? `<p class="chart-sub" style="margin:-8px 0 16px;">${g.aggNote}</p>` : '';

  panel.innerHTML = `
    <div id="agg-strip-${gName}">${groupAggStrip(gName)}</div>
    ${aggNote}
    ${scopeFootnote}
    <div class="chart-card" id="concernCard-${gName}" style="margin-bottom:20px;">
      <p class="chart-title">Key concern — grup ${gName}</p>
      <p class="chart-sub">Over budget, memburuk vs bulan lalu (MoM), dan memburuk vs tahun lalu (YoY), khusus sub-segmen di grup ini.</p>
      <ul id="concernList-${gName}" style="margin:8px 0 0; padding:0; list-style:none;"></ul>
    </div>
    <div class="segment-pills" id="pills-${gName}">${pillsHTML}</div>
    <div id="panel-tab-${gName}"></div>
  `;
  return panel;
}

function renderGroupConcerns(gName){
  const { concerns } = computeConcerns({ groupFilter: gName });
  renderConcernList(`concernList-${gName}`, concerns, 5);
}

function selectSegment(gName, sName){
  activeSegment[gName] = sName;
  document.querySelectorAll(`#pills-${gName} .segment-pill`).forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.segment === sName);
  });
  const g = DATA.groups[gName];
  const obj = sName === "__agg__" ? g.aggregate : g.segments[sName];
  const label = sName === "__agg__" ? `Semua ${gName} (agregat)` : sName;
  renderPanel(`tab-${gName}`, obj, label);
}

function selectTab(tabId){
  activeGroup = tabId;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tabId));
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("active", p.id===`tabpanel-${tabId}`));
  if(tabId === "Summary"){
    renderSummaryTab();
    return;
  }
  renderGroupConcerns(tabId);
  if(!activeSegment[tabId]) activeSegment[tabId] = "__agg__";
  selectSegment(tabId, activeSegment[tabId]);
}

function initTabs(){
  const nav = document.getElementById("tabNav");
  const panelsWrap = document.getElementById("tabPanels");
  const allTabs = ["Summary", ...DATA.groupOrder];

  allTabs.forEach(tabId=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.dataset.tab = tabId;
    btn.textContent = tabId;
    btn.addEventListener("click", ()=>selectTab(tabId));
    nav.appendChild(btn);

    const panel = tabId === "Summary" ? buildSummaryPanelDOM() : buildTabPanel(tabId);
    panelsWrap.appendChild(panel);
    if(tabId !== "Summary"){
      panel.querySelectorAll(".segment-pill").forEach(pill=>{
        pill.addEventListener("click", ()=>selectSegment(tabId, pill.dataset.segment));
      });
    }
  });
  selectTab("Summary");
}

/* ---------- bottom summary table (all leaf segments, grouped) ---------- */
function lmCellHTML(actual, lm, lowerIsBetter=true){
  if(actual===null||actual===undefined||lm===null||lm===undefined) return '<span class="tag na">n/a</span>';
  const d = actual - lm;
  if(Math.abs(d) < 0.005) return '<span class="tag na">flat</span>';
  const good = lowerIsBetter ? d<=0 : d>=0;
  const arrow = d>0 ? "▲" : "▼";
  return `<span class="tag ${good?'good':'bad'}">${arrow} ${Math.abs(d).toFixed(2)}pp</span>`;
}

function renderTable(){
  const tbody = document.querySelector("#summaryTable tbody");
  tbody.innerHTML = "";
  DATA.groupOrder.forEach(gName=>{
    const g = DATA.groups[gName];
    const oos = g.outOfScope || [];
    const groupRow = document.createElement("tr");
    groupRow.innerHTML = `<td class="group-row" colspan="8">${gName}</td>`;
    tbody.appendChild(groupRow);

    const aggTr = document.createElement("tr");
    const agg = g.aggregate;
    aggTr.innerHTML = `
      <td><i>Semua ${gName} (agregat)</i></td>
      <td class="num">${fmtNum(agg.enr[LAST])}</td>
      <td class="num">${fmtPct(agg.cocYTD[LAST])}</td>
      <td class="num">${lmCellHTML(agg.cocYTD[LAST], agg.cocYTD[LAST-1], true)}</td>
      <td class="num">${agg.budget ? fmtPct(agg.budget.cocYTD) : "n/a"}</td>
      <td class="num">${fmtPct(agg.npl90[LAST])}</td>
      <td class="num">${agg.tor[LAST]!==null&&agg.tor[LAST]!==undefined ? agg.tor[LAST]+"%" : "n/a"}</td>
      <td>${statusTag(agg.cocYTD[LAST], agg.budget?agg.budget.cocYTD:null, true)}</td>
    `;
    tbody.appendChild(aggTr);

    g.segmentOrder.forEach(sName=>{
      const p = g.segments[sName];
      const isOOS = oos.includes(sName);
      const displayName = isOOS ? `${sName} <span title="Di luar cakupan BFI Without FIT">*</span>` : sName;
      const tr = document.createElement("tr");
      if(!hasData(p)){
        tr.innerHTML = `<td>${displayName}</td><td colspan="7" style="color:var(--slate-500);">Tidak ada portofolio aktif</td>`;
      } else {
        tr.innerHTML = `
          <td>${displayName}</td>
          <td class="num">${fmtNum(p.enr[LAST])}</td>
          <td class="num">${fmtPct(p.cocYTD[LAST])}</td>
          <td class="num">${lmCellHTML(p.cocYTD[LAST], p.cocYTD[LAST-1], true)}</td>
          <td class="num">${p.budget ? fmtPct(p.budget.cocYTD) : "n/a"}</td>
          <td class="num">${fmtPct(p.npl90[LAST])}</td>
          <td class="num">${p.tor[LAST]!==null&&p.tor[LAST]!==undefined ? p.tor[LAST]+"%" : "n/a"}</td>
          <td>${statusTag(p.cocYTD[LAST], p.budget?p.budget.cocYTD:null, true)}</td>
        `;
      }
      tbody.appendChild(tr);
    });
  });
}

const MONTH_ID = {Jan:"Januari",Feb:"Februari",Mar:"Maret",Apr:"April",May:"Mei",Jun:"Juni",Jul:"Juli",Aug:"Agustus",Sep:"September",Oct:"Oktober",Nov:"November",Dec:"Desember"};
function fullMonthLabel(code){
  const [m, y] = code.split("-");
  return `${MONTH_ID[m]||m} 20${y}`;
}

function init(){
  document.getElementById("mastheadTitle").textContent = `Cost of Credit - Periode ${fullMonthLabel(DATA.months[LAST])}`;
  document.getElementById("periodBadge").textContent = "Periode terakhir: " + DATA.months[LAST];
  initTabs();
  renderTable();
}
init();
</script>

</body>
</html>
